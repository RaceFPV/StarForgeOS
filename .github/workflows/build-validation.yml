name: Build Validation

# Pull-request check: compile the native ESP-IDF firmware for every board.
# Does not upload or flash.

on:
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'platformio.ini'
      - 'CMakeLists.txt'
      - 'sdkconfig*'
      - 'partitions*.csv'
      - 'dependencies.lock'
      - '.github/workflows/build-validation.yml'

jobs:
  build-validation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-test-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-test-
          ${{ runner.os }}-pio-
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Run build validation
      run: |
        echo "Running native ESP-IDF firmware builds..."
        failed=0
        for env in esp32-c3-supermini esp32-c3 nuclearcounter esp32-c6 esp32dev esp32dev-2mb esp32-s3 esp32-s3-touch esp32-s3-t-energy esp32-s2 jc2432w328c; do
          echo "==== $env ===="
          pio run -e "$env" || failed=1
        done
        exit $failed
    
    - name: Generate Summary
      if: always()
      run: |
        echo "### Build Validation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Native ESP-IDF firmware compile for every board environment." >> $GITHUB_STEP_SUMMARY

