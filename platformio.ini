; Common settings for all environments
[env]
; Use custom platform (includes latest ESP-IDF 5.x for adc_continuous.h support)
; Alternative: platform = espressif32 @ ^6.5.0  (requires ESP-IDF 5.1+ for DMA ADC)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

; Common build flags (applied to all environments)
build_flags = 
    ; Increase TCP send buffer size to prevent socket buffer overflow when serving large files
    -DCONFIG_TCP_SND_BUF_DEFAULT=8192
    -DCONFIG_TCP_WND_DEFAULT=8192
    ; Increase TCP timeouts to prevent partial transfer errors with large files
    -DCONFIG_LWIP_TCP_KEEPALIVE=1
    -DCONFIG_LWIP_TCP_KEEPIDLE_DEFAULT=300
    -DCONFIG_LWIP_TCP_KEEPINTVL_DEFAULT=75
    -DCONFIG_LWIP_TCP_KEEPCNT_DEFAULT=9
    -DCONFIG_LWIP_TCP_MSL=60000
    -DCONFIG_LWIP_SO_RCVTIMEO=1

; Common libraries
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    ESPmDNS
    fastled/FastLED@^3.6.0
    ; Use maintained fork of ESPAsyncWebServer (mathieucarbou version is well-tested)
    ; Note: AsyncTCP is a dependency and will be installed automatically
    mathieucarbou/ESPAsyncWebServer@^3.3.21

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Filesystem for web files
board_build.filesystem = spiffs

; ============================================
; ESP32-C3 SuperMini (TESTED - WORKING)
; ============================================
[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
variant = ESP32C3
;framework = esp-idf
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_SINGLE_CORE=1
	-DBOARD_ESP32_C3_SUPERMINI=1
upload_flags = 
    --before=default_reset
    --after=hard_reset

; ============================================
; NuclearCounter (ESP32-C3 based, WIP)
; ============================================
[env:nuclearcounter]
board = esp32-c3-devkitm-1
variant = ESP32C3
lib_deps =
