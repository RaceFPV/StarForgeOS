; Common settings for all environments
[env]
; Use custom platform (includes latest ESP-IDF 5.x for adc_continuous.h support)
; Alternative: platform = espressif32 @ ^6.5.0  (requires ESP-IDF 5.1+ for DMA ADC)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf

; TCP and log settings live in sdkconfig.defaults. -DCONFIG_* flags conflict with
; sdkconfig.h once ESP-IDF compiles its own components with -Werror.

; Native ESP-IDF. Board-specific libraries (LVGL) are added on the LCD environments.

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Filesystem for web files. Partition map keeps firmware at 0x10000 and SPIFFS at 0x290000.
board_build.filesystem = spiffs
board_build.partitions = partitions_4mb.csv

; ============================================
; ESP32-C3 SuperMini (TESTED - WORKING)
; ============================================
[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
build_flags = 
	-DBOARD_ESP32_C3_SUPERMINI=1
upload_flags = 
    --before=default_reset
    --after=hard_reset

; ============================================
; NuclearCounter (ESP32-C3 based, WIP)
; ============================================
[env:nuclearcounter]
board = esp32-c3-devkitm-1
build_flags = 
    -DBOARD_NUCLEARCOUNTER=1
upload_flags = 
    --before=default_reset
    --after=hard_reset

; ============================================
; Generic ESP32-C3 Dev Module
; ============================================
[env:esp32-c3]
board = esp32-c3-devkitm-1
upload_flags = 
    --before=default_reset
    --after=hard_reset

; ============================================
; ESP32-C3 Zero Module
; ============================================
[env:esp32-c3-zero]
board = esp32-c3-devkitm-1
build_flags = 
    -DBOARD_ESP32_C3_ZERO=1
upload_flags = 
    --before=default_reset
    --after=hard_reset

; ============================================
; ESP32-C6 Dev Module (WiFi 6, single-core RISC-V)
; ============================================
[env:esp32-c6]
board = esp32-c6-devkitc-1
upload_flags = 
    --before=default_reset
    --after=hard_reset

; ============================================
; ESP32 Dev Module (Original ESP32)
; Default configuration for 4MB flash (ESP32-WROOM-32E, etc) - most common
; ============================================
[env:esp32dev]
board = esp32dev
monitor_dtr = 0
monitor_rts = 0

; ============================================
; ESP32 Dev Module (2MB Flash)
; For ESP32 boards with 2MB flash (ESP32-32S, NodeMCU-32S, etc)
; ============================================
[env:esp32dev-2mb]
board = esp32dev
monitor_dtr = 0
monitor_rts = 0
; Flash size configuration for 2MB boards
board_build.flash_size = 2MB
board_build.partitions = partitions_2mb.csv
board_build.cmake_extra_args = -DSTARFORGE_EXTRA_SDKCONFIG=sdkconfig.2mb

; ============================================
; LilyGo T-Energy (ESP32-S3 with built-in battery)
; Built-in 18650 battery slot with voltage sensing (2:1 divider on GPIO1)
; Battery pin configuration is defined in config.h for BOARD_T_ENERGY
; ============================================
[env:esp32-s3-t-energy]
board = esp32-s3-devkitc-1
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_T_ENERGY=1
    ; All configuration (LCD UI, battery monitoring, power button) is defined in config.h for BOARD_T_ENERGY

; ============================================
; ESP32-S3 Dev Module (Generic, with or without PSRAM)
; NO LCD/TOUCH - For standard ESP32-S3-DevKitC-1 boards
; ============================================
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_ESP32_S3_DEVKITC=1
    ; Explicitly disable LCD UI (not a touch board)
    -DENABLE_LCD_UI=0
    ; Explicitly disable battery monitor and power button (not present on generic board)
    -DENABLE_BATTERY_MONITOR=0
    -DENABLE_POWER_BUTTON=0

; ============================================
; ESP32-S3 with Touch LCD (Waveshare ESP32-S3-Touch-LCD-2.1)
; ============================================
[env:esp32-s3-touch]
board = esp32-s3-devkitc-1
; QIO flash + octal PSRAM. See sdkconfig.s3-touch.
board_build.cmake_extra_args = -DSTARFORGE_EXTRA_SDKCONFIG=sdkconfig.s3-touch

lib_compat_mode = off
lib_deps =
    lvgl/lvgl@8.3.11
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DBOARD_ESP32_S3_TOUCH=1
    ; LVGL configuration
    -DLV_CONF_PATH="${PROJECT_SRC_DIR}/ui/lv_conf.h"
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    ; Display configuration - Waveshare ESP32-S3-Touch-LCD-2 (ST7789T3 2" 240x320)
    ; Pin configuration verified from official Waveshare demo code
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_BACKLIGHT_ON=HIGH
    ; Display pins (SPI) - Waveshare ESP32-S3-Touch-LCD-2 (from official demo)
    -DTFT_MISO=40
    -DTFT_MOSI=38
    -DTFT_SCLK=39
    -DTFT_CS=45
    -DTFT_DC=42
    -DTFT_RST=-1
    -DTFT_BL=1
    ; Touch - CST816D capacitive touch controller (I2C) (from official demo)
    -DTOUCH_SDA=48
    -DTOUCH_SCL=47
    -DTOUCH_INT=-1
    -DTOUCH_RST=-1
    ; Font loading
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; SPI frequencies
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    
upload_flags = 
    --before=default_reset
    --after=hard_reset

; ============================================
; ESP32-S2 Dev Module
; ============================================
[env:esp32-s2]
board = esp32-s2-saola-1
build_flags = 
    -DCORE_DEBUG_LEVEL=3

; ============================================
; JC2432W328C - ESP32-D0WD-V3 with LCD/Touch
; ============================================
[env:jc2432w328c]
board = esp32dev
board_build.partitions = partitions_custom.csv
monitor_dtr = 0
monitor_rts = 0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings (macOS-friendly - balanced speed and reliability)
; Try speeds in order: 460800 (recommended) -> 230400 (if 460800 fails) -> 115200 (slowest)
upload_speed = 460800
upload_flags = 
    --before=default_reset
    --after=hard_reset
    --connect-attempts=5
    --chip=esp32

lib_compat_mode = off
lib_deps =
    lvgl/lvgl@8.3.11

; Build flags
build_flags = 
    -DBOARD_HAS_PSRAM=0
    ; Board configuration
    -DBOARD_JC2432W328C=1  ; Custom board flag for pin configuration
    ; LVGL configuration
    -DLV_CONF_PATH="${PROJECT_SRC_DIR}/ui/lv_conf.h"
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    ; Display configuration - JC2432W328C (ST7789 2.4" 240x320 - factory uses this!)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_OFF=1
    ; Display pins (HSPI)
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    ; Touch - CST820 capacitive touch (I2C)
    -DTOUCH_SDA=4
    -DTOUCH_SCL=5
    -DTOUCH_INT=36
    -DTOUCH_RST=-1
    ; Font loading
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; SPI frequencies
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

; ============================================
; TEST ENVIRONMENTS
; ============================================
; These environments are for running unit tests
; Run with: pio test -e test-esp32-c3

[env:test-esp32-c3]
board = esp32-c3-devkitm-1
build_flags = 
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DUNIT_TEST
    -DTEST_ESP32_C3
upload_flags = 
    --before=default_reset
    --after=hard_reset
test_framework = unity
test_build_src = no
test_ignore = 
    test_lcd

